[project]
name = "asanoha-export"
version = "0.0.0"
description = "Fixture generators for asanoha"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ase>=3.27,<4",
    "e3nn-jax==0.20.8",
    "jax==0.5.3",
    "matscipy>=1.3.1,<2",
    "numpy>=2,<3",
    "safetensors>=0.8,<0.9",
    "vesin>=0.6.2,<0.7",
]

[project.scripts]
asanoha-export = "asanoha_export.cli:main"

[tool.uv]
exclude-newer = "7 days"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"
